name: browser-packages

on:
  workflow_dispatch:
    inputs:
      intel:
        description: Include Intel after Apple Silicon qualification
        type: boolean
        default: false
  push:
    branches: [codex/m7-distribution]
    paths: [".github/workflows/release.yml", "scripts/m7/**", "crates/**", "web/src/studio/localHostLifecycle.ts", "web/src/main.tsx", "Cargo.lock", "docs/m7/acceptance/**", "docs/m7/license-supplements/**"]

permissions:
  contents: read

env:
  M7_STABLE: "1.99.0"
  M7_NIGHTLY: nightly-2026-10-28

jobs:
  assets:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[m7-arm64]') || contains(github.event.head_commit.message, '[m7-all]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          targets: wasm32-unknown-unknown
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Fixed wasm-pack
        run: |
          curl --fail --location --retry 3 https://github.com/wasm-bindgen/wasm-pack/releases/download/v0.15.0/wasm-pack-v0.15.0-x86_64-unknown-linux-musl.tar.gz -o /tmp/wasm-pack.tgz
          tar -xzf /tmp/wasm-pack.tgz -C /tmp
          echo /tmp/wasm-pack-v0.15.0-x86_64-unknown-linux-musl >> "$GITHUB_PATH"
      - name: Build both engines (mandatory)
        working-directory: crates/stencil-wasm
        run: |
          rustup run "$M7_STABLE" wasm-pack build --release --target web --out-dir ../../web/pkg -- --locked
          RUSTFLAGS='-C target-feature=+atomics,+bulk-memory,+mutable-globals -C link-args=--shared-memory -C link-args=--import-memory -C link-args=--max-memory=4294967296 -C link-args=--export=__wasm_init_tls -C link-args=--export=__tls_size -C link-args=--export=__tls_align -C link-args=--export=__tls_base' rustup run "$M7_NIGHTLY" wasm-pack build --release --target web --out-dir ../../web/public/pkg-mt --out-name stencil_wasm -- --locked --features threads -Z build-std=panic_abort,std
      - name: Production assets only
        run: |
          node web/scripts/patch-mt-worker.mjs
          npm --prefix web ci
          npm --prefix web run build
          test ! -e web/dist/legacy.html
          tar -czf production-assets.tar.gz web/dist
      - uses: actions/upload-artifact@v4
        with:
          name: production-assets
          path: production-assets.tar.gz

  apple-silicon:
    needs: assets
    runs-on: macos-15
    permissions:
      contents: write
    env:
      MACOSX_DEPLOYMENT_TARGET: "13.3"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.0
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-10-28
          components: rust-src
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: actions/download-artifact@v4
        with:
          name: production-assets
      - name: Build customer binaries
        run: |
          test "$(uname -m)" = arm64
          tar -xzf production-assets.tar.gz
          npm --prefix web ci
          cargo +1.99.0 build --locked --release -p stencil-cli -p stencil-launcher --features studio
          strip target/release/stencil target/release/stencil-studio
          python3 scripts/m7/licenses.py --out notices
          python3 scripts/m7/package.py --platform macos-arm64 --backend target/release/stencil --launcher target/release/stencil-studio --notices notices --out out --source "$GITHUB_SHA"
      - name: Extract and launch actual app bundle
        run: |
          mkdir -p extracted
          ditto -x -k out/StencilStudio-macOS-Apple-Silicon.zip extracted
          codesign --verify --deep --strict 'extracted/Stencil Studio.app'
          sw_vers > out/os-version.txt
          file 'extracted/Stencil Studio.app/Contents/MacOS/stencil-studio' 'extracted/Stencil Studio.app/Contents/Resources/stencil' > out/architectures.txt
          (spctl --assess --type execute --verbose=4 'extracted/Stencil Studio.app' > out/gatekeeper.txt 2>&1) || true
          open -n 'extracted/Stencil Studio.app' --args --no-open --profile-dir "$PWD/gui-profile"
          sleep 3
          pgrep -x stencil-studio > out/gui-launch-pids.txt
          screencapture -x out/actual-launcher.png
          kill -TERM "$(cat out/gui-launch-pids.txt)"
          sleep 3
          if lsof -a -c stencil -iTCP -sTCP:LISTEN > out/after-gui-close.txt; then echo 'Orphaned server'; exit 1; fi
      - name: Package acceptance in real browser engine
        env:
          M7_PYTHON: python3
        run: |
          cd web && npx playwright install chromium && cd ..
          node scripts/m7/package-qa.mjs 'extracted/Stencil Studio.app/Contents/MacOS/stencil-studio' out/chromium chromium
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: macos-arm64-browser-package
          path: out
      - name: Retain exact downloads on artifact branch
        if: always()
        run: python3 scripts/m7/archive-evidence.py out macos-arm64

  intel:
    if: inputs.intel || contains(github.event.head_commit.message, '[m7-all]')
    needs: apple-silicon
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - run: echo 'Intel packaging follows the Apple Silicon gate; not yet qualified.' && exit 1
