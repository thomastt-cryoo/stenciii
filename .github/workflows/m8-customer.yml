name: M8 actual download and customer checks
on:
  push:
    branches: [codex/m8-customer-qa]
permissions:
  contents: write
jobs:
  mac-approval:
    if: contains(github.event.head_commit.message, '[m8-mac-security]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: macos-15, platform: macos-arm64, name: StencilStudio-macOS-Apple-Silicon.zip}
          - {runner: macos-15-intel, platform: macos-x64, name: StencilStudio-macOS-Intel.zip}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm --prefix web ci
      - name: Exact customer ZIP download
        run: node scripts/m8/download.mjs '${{ matrix.name }}' work/download out/browser-download.json
      - name: Native app-specific approval with security enabled
        run: python scripts/m8/mac_security.py 'work/download/${{ matrix.name }}' out/security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-approval-${{ matrix.platform }}
          path: out
      - name: Retain actual UI results without a release
        if: always()
        run: python scripts/m7/archive-evidence.py out 'm8-security-${{ matrix.platform }}'
  download-security:
    if: contains(github.event.head_commit.message, '[m8-security]')
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: windows-2025, platform: windows-x64, name: StencilStudio-Windows-x64.zip}
          - {runner: macos-15, platform: macos-arm64, name: StencilStudio-macOS-Apple-Silicon.zip}
          - {runner: macos-15-intel, platform: macos-x64, name: StencilStudio-macOS-Intel.zip}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 26.3.0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: npm --prefix web ci
      - name: Actual browser download of exact reviewed customer ZIP
        run: node scripts/m8/download.mjs '${{ matrix.name }}' work/download out/browser-download.json
      - name: Windows shell extraction and security observations
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/m8/windows_security.ps1 -Archive 'work/download/${{ matrix.name }}' -Out out/security
      - name: Mac Archive Utility extraction and Gatekeeper approval
        if: runner.os == 'macOS'
        run: python scripts/m8/mac_security.py 'work/download/${{ matrix.name }}' out/security
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: m8-first-download-${{ matrix.platform }}
          path: out
      - name: Retain evidence without a release or hosting
        if: always()
        run: python scripts/m7/archive-evidence.py out 'm8-security-${{ matrix.platform }}'
  reviewed-delivery:
    if: contains(github.event.head_commit.message, '[m8-delivery]')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/checkout@v4
        with:
          ref: codex/m7-artifacts
          path: retained
          sparse-checkout: m7-current/customer
      - name: Assemble and audit five files without changing tested ZIPs
        run: python scripts/m8/finalize_delivery.py --source retained/m7-current/customer --out out/customer
      - name: Require canonical manifest identity
        run: cmp out/delivery-manifest.json distribution/m8/delivery-manifest.json
      - name: Retain review evidence with the customer files
        run: |
          cp -R docs/m8 out/review-evidence
          cp docs/M8_REPORT.md out/M8_REPORT.md
      - uses: actions/upload-artifact@v4
        with:
          name: stencil-studio-m8-customer-review
          path: out
      - name: Commit exact deliverables without publishing a release
        run: python scripts/m8/retain_delivery.py out
