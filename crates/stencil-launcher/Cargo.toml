[package]
name = "stencil-launcher"
version = "2.9.4"
edition = "2021"
description = "Offline Stencil Studio browser launcher with managed local hosting"
license = "Unlicense"

[[bin]]
name = "stencil-studio"
path = "src/main.rs"

[dependencies]
open = "5"
serde_json = "1"
directories = "=6.0.0"
fs2 = "=0.4.3"
sha2 = "=0.10.9"

[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "=0.17.2", default-features = false }

[target.'cfg(windows)'.dependencies]
rfd = { version = "=0.17.2", default-features = false, features = ["common-controls-v6"] }
windows-sys = { version = "=0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[build-dependencies]
embed-manifest = "=1.5.1"
